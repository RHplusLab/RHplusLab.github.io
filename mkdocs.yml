site_name: RH+ Humanoid Project
site_description: Roboin Humanoid Plus Project — ROS2 휴머노이드 제어 구축 가이드
site_url: https://rhpluslab.github.io/
repo_url: https://github.com/RHplusLab
repo_name: RHplusLab
copyright: © 2025–2026 Roboin Humanoid Plus (RH+) Project

theme:
  name: material
  language: ko
  features:
    - navigation.path          # 상단 경로 표시 (Installation / ...)
    - navigation.footer        # 하단 Previous / Next
    - navigation.top           # 맨 위로 버튼
    - toc.integrate            # 페이지 목차를 왼쪽 메뉴에 통합 (navigation.indexes와 함께 쓸 수 없음)
    - toc.follow               # 목차가 스크롤 따라감
    - search.highlight
    - search.suggest
    - content.code.copy        # 코드블록 복사 버튼
    - content.code.annotate
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition                 # 참고/경고 박스
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences       # 중첩 코드블록
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:       # 수식 (ZMP 등)
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox            # 사진 클릭 시 크게 보기

extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css
  - css/extra.css

extra_javascript:
  - js/nav-toggle.js
  - js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation:
      - Overview: install/index.md
      - Ubuntu & ROS2: install/ros2.md
      - Workspace Setup: install/workspace.md
  - Hardware Interface:
      - Overview: hw/index.md
      - Robot Description: hw/description.md
      - Hardware Plugin: hw/interface.md
      - OP3 Reference: hw/op3.md
  - Arena Setup: arena.md
  - High Level Control:
      - Overview: vision/index.md
      - Camera & 6D Pose: vision/pose.md
  - Walking Pattern:
      - Overview: walk/index.md
      - ZMP-Based Walking: walk/zmp.md
      - References: walk/refs.md
  - RL Control: rl.md
  - Task Generation: task/index.md
  - 7-DoF Manipulator:
      - Overview: arm/index.md
      - MoveIt2 Basics: arm/moveit2.md
      - MoveIt Task Constructor: arm/mtc.md
      - Pick & Place: arm/pick-place.md
      - AprilTag Integration: arm/apriltag.md
  - Learning Path:
      - Overview: study/index.md
      - Control Theory Curriculum: study/curriculum.md
      - Troubleshooting: study/troubleshooting.md
